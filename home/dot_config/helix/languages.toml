[language-server.gopls.config]
gofumpt = true
deepCompletion = true
staticcheck = true

[language-server.gopls.config.analyses]
fieldalignment = true
nilness = true
shadow = true
unusedparams = true
unreachable = true

[language-server.clangd]
command = "clangd"
args = ["--clang-tidy", "--completion-style=detailed", "--header-insertion=iwyu"] 

[language-server.clangd.config]
Completion.AllScopes = "Yes"
Diagnostics.UnusedIncludes = "Strict"
Index.StandardLibrary = "Yes"

[[language]]
name = "cpp"
auto-format = true
formatter = { command = "clang-format", args = ["--sort-includes", "--Werror"] }

[[language]]
name = "python"
auto-format = true

[language-server.pylsp.config.pylsp]
plugins.black.enabled = true
plugins.pylint.enabled = true
plugins.pyflakes.enabled = false
plugins.pyls_mypy.enabled = true
plugins.pyls_mypy.live_mode = false
plugins.isort.enabled = true
plugins.rope_autoimport.enabled = true

[language-server.yaml-language-server.config]
yaml.keyOrdering = false
