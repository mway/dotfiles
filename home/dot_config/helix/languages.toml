[language-server.gopls.config]
gofumpt = true
deepCompletion = true
staticcheck = true

[language-server.gopls.config.analyses]
gofix = true
hostport = true
modernize = true
nilness = true
shadow = true
unusedfunc = true
unusedparams = true
unreachable = true

[[language]]
name = "cpp"
auto-format = true
formatter = { command = "clang-format", args = ["--Werror"] }

[language-server.clangd]
command = "clangd"
args = ["--clang-tidy", "--completion-style=detailed", "--header-insertion=iwyu"] 

[language-server.clangd.config]
Completion.AllScopes = "Yes"
Diagnostics.UnusedIncludes = "Strict"
Index.StandardLibrary = "Yes"

[[language]]
name = "rust"
formatter = { command = "rustfmt" }

[[language]]
name = "python"
language-servers = ["pylsp"]
formatter = { command = "sh", args = ["-c", "black --quiet --line-length=79 - | isort --multi-line=VERTICAL_HANGING_INDENT --profile=black -"] }
auto-format = true

[language-server.pylsp.config.pylsp.plugins]
jedi_completion = { enabled = true, include_params = true, include_class_objects = true, include_function_objects = true }
black = { enabled = false }
ruff = { enabled = false }
flake8 = { enabled = false }
pylint = { enabled = false }
pyflakes = { enabled = false }
pyls_mypy = { enabled = false, follow_untyped_imports = true, live_mode = false }
isort = { enabled = false, profile = "black" }
rope_autoimport = { enabled = false }

[[language]]
name = "bash"
indent = { tab-width = 2, unit = "  " }
formatter = { command = 'shfmt', args = ["-i", "2"] }
auto-format = true

[language-server.yaml-language-server.config]
yaml.keyOrdering = false
