[env]
_.path = [
  "~/bin",
  "~/.local/bin",
  "/opt/homebrew/bin",
  "~/.local/share/uv/venv/bin",
  "~/.bun/bin",
  "~/Library/pnpm",
  "~/.docker/bin",
  "~/.orbstack/bin",
  "~/.lmstudio/bin",
]

VISUAL = "hx"
EDITOR = "{{ env.VISUAL }}"
DELTA_PAGER = "less -R"
LESS = "-R --mouse"
LS_COLORS = 'di=38;5;108:fi=00:*svn-commit.tmp=31:ln=38;5;116:ex=38;5;186'
PROMPT = "%F{blue}#%F{magenta}>%F{reset} "
TERM = "xterm-256color"
GOPRIVATE = "go.mway.dev/*,github.com/groq/*"
UV_VIRTUALENV_BIN = "{{ env.HOME }}/.local/share/uv/venv/bin"
PNPM_HOME = "{{ env.HOME }}/Library/pnpm"
FZF_CTRL_T_OPTS = "--preview 'bat --color=always {}' --preview-window '~3'"
FZF_CTRL_R_OPTS = "--nth=2.."
FZF_COMPLETION_TRIGGER = ""

# Misc
ANSIBLE_NOCOWS = "1"
BASH_SILENCE_DEPRECATION_WARNING = "1"
MWAY_ZSH_TERSE_PROMPT = "1"
